name: CI

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.leg != 'baseline' }}

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  test:
    name: Test on perl ${{ matrix.perl_version }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        # trixie, bookworm, jammy, bullseye
        # noble 5.38.2 is ubuntu-24.04, in coverage run
        perl_version: [ 5.40.1, 5.36.0, 5.34.0, 5.32.1 ]
        experimental: [ false ]
        #include:
        #  - perl_version: 5.40.1
        #    experimental: true

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        submodules: true
        persist-credentials: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
        test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

    - name: Setup cache (carton)
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: local
        key: ubuntu-24-perl-${{ matrix.perl_version }}-carton-${{ hashFiles('cpanfile.snapshot') }}

    - name: Setup cache (perl)
      id: cache-perl
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/perl5
        key: ubuntu-24-perl-${{ matrix.perl_version }}

    - name: Install correct perl
      if: steps.cache-perl.outputs.cache-hit != 'true'
      run: |
          wget -qO - https://install.perlbrew.pl | bash
          ~/perl5/perlbrew/bin/perlbrew install --notest ${{ matrix.perl_version }}
          ~/perl5/perlbrew/bin/perlbrew clean

    - name: Add packages
      run: |
        sudo apt update
        sudo apt install -y gettext jhead language-pack-en language-pack-de language-pack-sv libimage-magick-perl libreadline-dev libpng-dev
        ~/perl5/perlbrew/bin/perlbrew exec vendor/bin/carton install --deployment
        commonlib/bin/gettext-makemo FixMyStreet

    - name: Add postgis
      if: matrix.perl_version == '5.40.1'
      run: |
        sudo apt install -y postgresql-postgis
        echo "WITH_POSTGIS=1" >> "$GITHUB_ENV"

    - name: Run tests
      run: ~/perl5/perlbrew/bin/perlbrew exec script/test --jobs 3 t
